name: ci

# §4: the gate lives on the pull request. This repo deployed from main with
# nothing checking a change first, so the deploy was the first thing to find out.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name is the required-check context; the estate requires `ci`.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate modDesc.xml
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('mod/modDesc.xml'); print('modDesc.xml is well-formed')"
      - name: Build mod zip
        # GIANTS requires modDesc.xml at the zip root, so build it the same way
        # the release does — a layout mistake is only visible in the artifact.
        run: |
          cd mod && zip -qr ../mod.zip . && cd ..
          unzip -l mod.zip | grep -q ' modDesc.xml$' \
            || { echo "::error::modDesc.xml is not at the zip root"; exit 1; }
          echo "zip builds with modDesc.xml at the root"
